version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: real_estate_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: real_estate
    ports:
      - "3306:3306"
    volumes:
      - ../data/raw:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: